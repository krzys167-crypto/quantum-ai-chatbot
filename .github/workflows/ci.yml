# Tests + typecheck + production build on every pull request and on main. Read-only, no secrets, no deploy.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node version (the tests need Node 20 or newer)
        run: |
          node -v
          node -e "process.exit(Number(process.versions.node.split('.')[0]) >= 20 ? 0 : 1)"
      # `npm ci` cannot be used yet: package-lock.json is out of sync with package.json on upstream
      # (express and pdfkit are missing from the lock). Regenerate the lock, then switch back to `npm ci`.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Typecheck and production build
        run: npm run build
